name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q skillbook-fabric-26.1.2.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - run: gradle build
        working-directory: skillbook-fabric-26.1.2
      - uses: actions/upload-artifact@v4
        with:
          name: skillbook-jar
          path: |
            skillbook-fabric-26.1.2/build/libs/skillbook-*.jar
            !skillbook-fabric-26.1.2/build/libs/*-sources.jar
